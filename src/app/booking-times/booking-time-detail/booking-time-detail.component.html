<div class="container-fluid container-cfg">

  <div *ngIf="bookingTime">

    <div style="text-align: center">
      <div class="inline clock-out-txt" style="margin-right: 20px;">
        <label class=" clock-in-txt">Eingestempelt</label>
        <app-time-input [(value)]="bookingTime.clockIn" (valueChange)="markAsEdited()"></app-time-input>
      </div>
      <div class="inline clock-in-txt">
        <label class=" clock-out-txt">Ausgestempelt</label>
        <app-time-input [(value)]="bookingTime.clockOut" (valueChange)="markAsEdited()"></app-time-input>
      </div>
    </div>
    <br>
    <div>
      <div>
        <label>Grund</label>
        <app-select [options]="appService.bookingKeys" [(selected)]="selectedBookingKey" (selectedChange)="markAsEdited()"></app-select>
      </div>
    </div>
    <hr>
    <div>
      <div>
        <acc-datepicker style="display: inline-block;" [title]="'Datum'" [value]="bookingDate"
          (valueChange)="changeDate($event)">
        </acc-datepicker>

        <button *ngIf="!bookingTime.comment" style="float:right; font-size: 10px;" class="btn btn-primary"
          (click)="bookingTime.comment = ' '">
          + Bemerkung
        </button>
      </div>
      <div class="form-group" *ngIf="bookingTime.comment">
        <label>Kommentar</label>
        <textarea class="form-control" [(ngModel)]="bookingTime.comment">
          </textarea>
      </div>
    </div>

    <div class="info-badge">
      <i-feather style="margin-right: 10px; color: orange;" *ngIf="bookingTime.isEdited" name="alert-octagon"
        (click)="showMessage('Zeiten wurden manuell geändert')">
      </i-feather>



      <i-feather *ngIf="bookingLocations.length != 0" name="map-pin" (click)="isMapsVisible=!isMapsVisible"></i-feather>
    </div>

    <!--Geolocation-->
    <ng-container *ngIf="isMapsVisible">
      <app-geolocation [bookingLocations]="bookingLocations">

      </app-geolocation>
    </ng-container>

    <label class="right delete-btn" (click)="deleteBtn()">Löschen</label>
    <hr>
    <div style="text-align: center">
      <button style="background: transparent;" (click)="cancel()" class="btn inline">Abbrechen</button>
      <button style="" (click)="save()" class="btn btn-success">Speichern</button>
    </div>

  </div>

</div>
