<div class="animate-all"
     [style.height]="isOpen? '70px': '0px'"
     [style.padding]="isOpen? '16px 24px': '0px'"
     [style.opacity]="isOpen? '1': '0'">


  <a (click)="cancel()" class="btn btn-success" style="font-size: 10px; margin-right: 15px;border: 0px;">
    {{'Abbrechen'}}
  </a>

  <button (click)="save()" class="btn btn-success" style="font-size: 10px;" *ngIf="isOpen">
    Speichern</button>

  <i *ngIf="withPreview" style="cursor:pointer" (click)="showprev()" class="material-icons">visibility</i>

</div>

<div *ngIf="showPreview&&changedProperties.length!=0" style="margin-top:10px; padding: 5px; border: 1px solid;">

  <table>
    <thead>
      <tr>
        <th>Key</th>
        <th>Before</th>
        <th>After</th>
      </tr>

    </thead>
    <tbody>

      <tr *ngFor="let changedProperty of changedProperties">

        <td>{{changedProperty.key}}</td>
        <td>{{changedProperty.before}}</td>
        <td>{{changedProperty.after}}</td>

      </tr>

    </tbody>
  </table>

</div>
