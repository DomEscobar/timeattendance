<div class="container-fluid" style="    max-width: 900px; margin-top: 12%;">
  <br>
  <div class="row" *ngIf="user">
    <div class="col-sm-6 col-md-4" style="margin-bottom: 15px;">
      <label>Vorname</label>
      <input class="form-control" [(ngModel)]="user.firstname" />
    </div>
    <div class="col-sm-6 col-md-4" style="margin-bottom: 15px;">
      <label>Nachname</label>
      <input class="form-control" [(ngModel)]="user.lastname" />
    </div>
    <div *ngIf="!appservice.isOnline" class="col-sm-12 col-md-4" style="text-align: right;">
      <button (click)="addDetail()" class="btn btn-primary new-booking" style="margin-top: 15px">+
        Detail
      </button>
    </div>

    <div class="col-sm-12 col-md-4" style="text-align: left;position: relative; margin-top: 0px;margin-bottom: 15px; "
      *ngFor="let detail of user.userDetails">
      <div>
        <label>{{appservice.getNameOfDetail(detail.detailid)}}</label>
        <input class="form-control" [(ngModel)]="detail.value" />
      </div>
      <i-feather *ngIf="!appservice.isOnline" class="del-ico" (click)="deleteDetail(detail)" name="trash"></i-feather>

    </div>

    <!--
      <div class="col-sm-12 col-md-4" style="text-align: center">
        <label>Unterschrift</label>
        <canvas appSignaturePad style="border: 1px solid #dadada;" class="signature-pad" [onClear]="onSignatureClear"
        width="300" height="100">
      </canvas>
      <div class="mini-button " (click)="newSignature()">neu</div>
    </div>
  -->
  </div>

  <div class="" style="margin-top: 20px" *ngIf="user">

    <app-save-panel [objectToSave]="[user, user.userDetails]" (onSave)="save()"
      (onCancel)="user=$event[0]; user.userDetails = $event[1];">
    </app-save-panel>

  </div>

  <br>

  <label>Theme</label>
  <div class="theme-btn b {{isDark ? 'ison':''}}" (click)="setDark(true)">
    <i-feather name="moon"></i-feather>
  </div>
  <div class="theme-btn w {{!isDark ? 'ison':''}}" (click)="setDark(false)">
    <i-feather name="sun"></i-feather>
  </div>

</div>

<div class="connection-panel">
  <div *ngIf="!variablesService.isOnline" (click)="connect()">
    <i-feather name="cloud-off"></i-feather> <span style="font-size: 11px;margin-left: 10px;">Nicht verbunden</span>
  </div>
  <div *ngIf="variablesService.isOnline">
    <i-feather name="cloud"></i-feather> <span style="font-size: 11px; margin-left: 10px;">Verbunden </span>
  </div>
</div>
